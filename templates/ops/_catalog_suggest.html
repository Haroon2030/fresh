{# بحث ذكي مشترك للأصناف — يُضمَّن مرة واحدة ثم يُستدعى عبر FarshCatalogSuggest #}
<style>
.catalog-suggest-wrap { position: relative; }
.catalog-suggest-menu {
    position: fixed;
    z-index: 9999;
    max-height: min(280px, 42vh);
    overflow-y: auto;
    background: #fff;
    border: 1px solid #93c5fd;
    border-radius: 10px;
    box-shadow: 0 16px 36px rgba(15, 39, 68, 0.22);
    display: none;
    min-width: 220px;
}
.catalog-suggest-menu.is-open { display: block; }
.catalog-suggest-item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border: 0;
    background: transparent;
    text-align: right;
    cursor: pointer;
    font: inherit;
    color: #0f172a;
}
.catalog-suggest-item:hover,
.catalog-suggest-item.is-active { background: #eff6ff; }
.catalog-suggest-name { font-weight: 700; font-size: 13px; }
.catalog-suggest-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    flex-shrink: 0;
}
.catalog-suggest-num {
    font-weight: 700;
    font-size: 12px;
    color: #1d4ed8;
    direction: ltr;
}
.catalog-suggest-unit {
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
}
.catalog-suggest-empty {
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
}
.catalog-suggest-actions {
    display: flex;
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #dbeafe;
    background: #f8fbff;
    position: sticky;
    bottom: 0;
}
.catalog-suggest-actions button {
    flex: 1;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    background: #fff;
    color: #1d4ed8;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 8px;
    cursor: pointer;
}
.catalog-suggest-actions button:hover { background: #eff6ff; }
.catalog-suggest-actions .is-clear {
    border-color: #fecaca;
    color: #b91c1c;
    background: #fff1f2;
}
.catalog-suggest-actions .is-clear:hover { background: #ffe4e6; }
.catalog-suggest-wrap.is-filled .catalog-suggest-input {
    background: #f0fdf4;
    font-weight: 700;
}
.catalog-clear-btn {
    position: absolute;
    top: 50%;
    left: 6px;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 999px;
    background: #fee2e2;
    color: #b91c1c;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
    padding: 0;
}
.catalog-suggest-wrap.is-filled .catalog-clear-btn { display: inline-flex; }
.catalog-suggest-wrap.is-filled .catalog-suggest-input { padding-left: 34px; }
.catalog-clear-btn .material-symbols-outlined { font-size: 16px; line-height: 1; }

/* داخل جداول إكسل: غلاف البحث لا يرفع ارتفاع الخلية */
.excel-grid .catalog-suggest-wrap,
.app-data-grid .catalog-suggest-wrap {
    height: 28px;
    line-height: 28px;
}
.excel-grid .catalog-suggest-wrap .catalog-suggest-input,
.app-data-grid .catalog-suggest-wrap .catalog-suggest-input {
    height: 28px !important;
    min-height: 28px !important;
    line-height: 28px !important;
    padding: 0 8px !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    background: transparent !important;
}
.excel-grid .catalog-suggest-wrap.is-filled .catalog-suggest-input,
.app-data-grid .catalog-suggest-wrap.is-filled .catalog-suggest-input {
    padding-left: 28px !important;
    background: #f0fdf4 !important;
}
.excel-grid .catalog-clear-btn,
.app-data-grid .catalog-clear-btn {
    width: 18px;
    height: 18px;
    left: 4px;
}
.excel-grid .catalog-clear-btn .material-symbols-outlined,
.app-data-grid .catalog-clear-btn .material-symbols-outlined {
    font-size: 14px;
}
</style>
<script>
window.FarshCatalogSuggest = (function () {
    let catalog = [];
    let activeMenu = null;
    let activeInput = null;
    let activeItems = [];
    let activeIndex = -1;

    function setCatalog(list) {
        catalog = (Array.isArray(list) ? list : [])
            .map((row) => resolveCatalogItem(row))
            .filter(Boolean);
    }

    function escapeHtml(text) {
        return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function normalize(text) {
        return String(text || '')
            .trim()
            .toLowerCase()
            .replace(/[أإآٱ]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي')
            .replace(/ؤ/g, 'و')
            .replace(/ئ/g, 'ي')
            .replace(/\s+/g, ' ');
    }

    function scoreMatch(item, query) {
        const q = normalize(query);
        if (!q) return 0;
        const name = normalize(item.name);
        const num = normalize(item.item_number);
        if (num === q) return 100;
        if (name === q) return 95;
        if (num.startsWith(q)) return 90;
        if (name.startsWith(q)) return 85;
        if (num.includes(q)) return 70;
        if (name.includes(q)) return 65;
        const tokens = q.split(' ').filter(Boolean);
        if (tokens.length > 1 && tokens.every((t) => name.includes(t) || num.includes(t))) return 60;
        return 0;
    }

    function searchCatalog(query, limit) {
        const scored = [];
        for (const item of catalog) {
            const score = scoreMatch(item, query);
            if (score > 0) scored.push({ item, score });
        }
        scored.sort((a, b) => b.score - a.score || String(a.item.name).localeCompare(String(b.item.name), 'ar'));
        return scored.slice(0, limit || 8).map((x) => x.item);
    }

    function fieldHtml(opts) {
        const o = opts || {};
        const name = o.name || 'item_name';
        const cls = o.inputClass || 'cell-input catalog-suggest-input';
        const ph = o.placeholder || (name === 'item_number' ? 'رقم الصنف' : 'ابحث عن الصنف...');
        const dir = o.dir ? ` dir="${o.dir}"` : '';
        const req = o.required ? ' required' : '';
        const field = name === 'item_number' ? 'number' : 'name';
        return `
            <div class="catalog-suggest-wrap">
                <input class="${cls}" name="${name}" type="text" placeholder="${ph}"${dir}${req}
                       data-catalog-field="${field}" autocomplete="off">
                <button type="button" class="catalog-clear-btn" title="إلغاء الصنف" aria-label="إلغاء الصنف">
                    <span class="material-symbols-outlined">close</span>
                </button>
                <div class="catalog-suggest-menu" role="listbox"></div>
            </div>
        `;
    }

    function getMenuForWrap(wrap) {
        if (!wrap) return null;
        const local = wrap.querySelector('.catalog-suggest-menu');
        if (local) return local;
        const homeId = wrap.getAttribute('data-suggest-home');
        if (!homeId) return null;
        return document.querySelector(`.catalog-suggest-menu[data-home-id="${homeId}"]`);
    }

    function ensureWrapped(input) {
        if (!input) return null;
        if (!input.getAttribute('data-catalog-field')) {
            const field = input.name === 'item_number' ? 'number' : (input.name === 'item_name' ? 'name' : '');
            if (field) input.setAttribute('data-catalog-field', field);
        }
        let wrap = input.closest('.catalog-suggest-wrap');
        if (wrap) return wrap;
        wrap = document.createElement('div');
        wrap.className = 'catalog-suggest-wrap';
        input.classList.add('catalog-suggest-input');
        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);
        const clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.className = 'catalog-clear-btn';
        clearBtn.title = 'إلغاء الصنف';
        clearBtn.setAttribute('aria-label', 'إلغاء الصنف');
        clearBtn.innerHTML = '<span class="material-symbols-outlined">close</span>';
        wrap.appendChild(clearBtn);
        const menu = document.createElement('div');
        menu.className = 'catalog-suggest-menu';
        menu.setAttribute('role', 'listbox');
        wrap.appendChild(menu);
        return wrap;
    }

    function detachMenuHome(menu) {
        if (!menu || menu.dataset.ported !== '1') return;
        const homeId = menu.dataset.homeId;
        const home = homeId ? document.querySelector(`[data-suggest-home="${homeId}"]`) : null;
        if (home) home.appendChild(menu);
        delete menu.dataset.ported;
        delete menu.dataset.homeId;
    }

    function ensureMenuPortaled(menu, wrap) {
        if (!menu || !wrap) return;
        if (menu.dataset.ported === '1') return;
        let homeId = wrap.getAttribute('data-suggest-home');
        if (!homeId) {
            homeId = `cs-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
            wrap.setAttribute('data-suggest-home', homeId);
        }
        menu.dataset.homeId = homeId;
        menu.dataset.ported = '1';
        document.body.appendChild(menu);
    }

    function positionMenu(menu, input) {
        if (!menu || !input) return;
        const wrap = input.closest('.catalog-suggest-wrap');
        ensureMenuPortaled(menu, wrap);
        const rect = input.getBoundingClientRect();
        const gap = 4;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const width = Math.max(rect.width, 280);
        let left = rect.left;
        if (left + width > vw - 8) left = Math.max(8, vw - width - 8);
        if (left < 8) left = 8;

        menu.style.width = `${width}px`;
        menu.style.left = `${left}px`;
        menu.style.right = 'auto';
        menu.classList.add('is-open');

        const spaceBelow = vh - rect.bottom - gap - 8;
        const spaceAbove = rect.top - gap - 8;
        const openUp = spaceBelow < 160 && spaceAbove > spaceBelow;
        if (openUp) {
            menu.style.top = 'auto';
            menu.style.bottom = `${vh - rect.top + gap}px`;
            menu.style.maxHeight = `${Math.max(140, Math.min(300, spaceAbove))}px`;
        } else {
            menu.style.bottom = 'auto';
            menu.style.top = `${rect.bottom + gap}px`;
            menu.style.maxHeight = `${Math.max(140, Math.min(300, spaceBelow))}px`;
        }
    }

    function closeSuggest() {
        if (activeMenu) {
            activeMenu.classList.remove('is-open');
            activeMenu.style.top = '';
            activeMenu.style.bottom = '';
            activeMenu.style.left = '';
            activeMenu.style.right = '';
            activeMenu.style.width = '';
            activeMenu.style.maxHeight = '';
            detachMenuHome(activeMenu);
        }
        activeMenu = null;
        activeInput = null;
        activeItems = [];
        activeIndex = -1;
    }

    function markFilled(tr) {
        const numInput = tr.querySelector('input[name="item_number"]');
        const nameInput = tr.querySelector('input[name="item_name"]');
        const filled = !!(numInput?.value.trim() && nameInput?.value.trim());
        tr.querySelectorAll('.catalog-suggest-wrap').forEach((wrap) => {
            wrap.classList.toggle('is-filled', filled);
        });
    }

    function clearRow(tr, focusName, options) {
        if (!tr) return;
        const numInput = tr.querySelector('input[name="item_number"]');
        const nameInput = tr.querySelector('input[name="item_name"]');
        if (numInput) numInput.value = '';
        if (nameInput) nameInput.value = '';
        const opts = options || {};
        if (opts.unitField) {
            const unitEl = tr.querySelector(opts.unitField);
            if (unitEl) unitEl.value = '';
        }
        if (opts.packageField) {
            const pkgEl = tr.querySelector(opts.packageField);
            if (pkgEl) pkgEl.value = '';
        }
        tr.querySelectorAll('.catalog-suggest-wrap').forEach((wrap) => wrap.classList.remove('is-filled'));
        closeSuggest();
        const focusEl = focusName ? nameInput : numInput;
        focusEl?.focus();
        if (focusEl) openSuggestFor(focusEl, tr, opts);
    }

    function looksLikeSku(value) {
        const v = String(value || '').trim();
        if (!v) return false;
        if (/[\u0600-\u06FF]/.test(v)) return false;
        return /^[0-9][0-9A-Za-z\-_./]*$/.test(v);
    }

    function looksLikeProductName(value) {
        const v = String(value || '').trim();
        if (!v) return false;
        if (looksLikeSku(v)) return false;
        return /[\u0600-\u06FFA-Za-z]/.test(v);
    }

    function resolveCatalogItem(item) {
        if (!item || typeof item !== 'object') return null;
        let number = String(item.item_number ?? item.number ?? '').trim();
        let name = String(item.name ?? item.item_name ?? '').trim();
        const unit = String(item.unit ?? '').trim();
        if (!number && !name) return null;
        // صحّح إن كان الرقم والاسم معكوسين في الكتالوج
        if (looksLikeSku(name) && looksLikeProductName(number)) {
            const tmp = number;
            number = name;
            name = tmp;
        }
        return { item_number: number, name, unit };
    }

    function applyItem(tr, item, options) {
        if (!tr) return;
        const resolved = resolveCatalogItem(item);
        if (!resolved) return;
        const opts = options || {};
        const numInput =
            tr.querySelector('input[data-catalog-field="number"]') ||
            tr.querySelector('input[name="item_number"]');
        const nameInput =
            tr.querySelector('input[data-catalog-field="name"]') ||
            tr.querySelector('input[name="item_name"]');
        if (numInput) numInput.value = resolved.item_number;
        if (nameInput) nameInput.value = resolved.name;

        const units = String(resolved.unit || '').split(/[،,]/).map((u) => u.trim()).filter(Boolean);
        if (opts.unitField) {
            const unitEl = tr.querySelector(opts.unitField);
            if (unitEl && units.length) {
                if (unitEl.tagName === 'SELECT') {
                    const hit = units.find((u) => Array.from(unitEl.options).some((o) => o.value === u));
                    if (hit) unitEl.value = hit;
                    else if (!unitEl.value) unitEl.value = units[0];
                } else if (!unitEl.value) {
                    unitEl.value = units[0];
                }
            }
        }
        if (opts.packageField) {
            const pkgEl = tr.querySelector(opts.packageField);
            const choices = opts.packageChoices || [];
            if (pkgEl && units.length) {
                if (pkgEl.tagName === 'SELECT') {
                    const hit = units.find((u) => choices.includes(u) || Array.from(pkgEl.options).some((o) => o.value === u));
                    if (hit) pkgEl.value = hit;
                } else if (!pkgEl.value) {
                    pkgEl.value = units[0];
                }
            }
        }
        markFilled(tr);
        closeSuggest();
        if (typeof opts.onApply === 'function') opts.onApply(tr, resolved);
    }

    function highlightActive(menu) {
        menu.querySelectorAll('.catalog-suggest-item').forEach((el, idx) => {
            el.classList.toggle('is-active', idx === activeIndex);
        });
        const active = menu.querySelector('.catalog-suggest-item.is-active');
        if (active) active.scrollIntoView({ block: 'nearest' });
    }

    function renderSuggest(menu, items, query, tr, options, input) {
        let html = '';
        if (!items.length) {
            html = `<div class="catalog-suggest-empty">لا نتائج لـ «${escapeHtml(query)}»</div>`;
            activeItems = [];
            activeIndex = -1;
        } else {
            html = items.map((item, idx) => {
                const resolved = resolveCatalogItem(item) || { item_number: '', name: '', unit: '' };
                const unit = String(resolved.unit || '').trim();
                const num = String(resolved.item_number || '').trim();
                const name = String(resolved.name || '').trim();
                const payload = encodeURIComponent(JSON.stringify({
                    item_number: num,
                    name,
                    unit,
                }));
                return `
                <button type="button" class="catalog-suggest-item" data-idx="${idx}"
                    data-payload="${payload}"
                    data-item-number="${escapeHtml(num)}"
                    data-item-name="${escapeHtml(name)}"
                    data-item-unit="${escapeHtml(unit)}">
                    <span class="catalog-suggest-name">${escapeHtml(name || '—')}</span>
                    <span class="catalog-suggest-meta">
                        <span class="catalog-suggest-num">${escapeHtml(num || '—')}</span>
                        ${unit ? `<span class="catalog-suggest-unit">${escapeHtml(unit)}</span>` : ''}
                    </span>
                </button>`;
            }).join('');
            activeItems = items.map((it) => resolveCatalogItem(it)).filter(Boolean);
            activeIndex = 0;
        }
        html += `
            <div class="catalog-suggest-actions">
                <button type="button" data-suggest-action="replace">استبدال الصنف</button>
                <button type="button" class="is-clear" data-suggest-action="clear">إلغاء / مسح</button>
            </div>
        `;
        menu.innerHTML = html;
        menu.classList.add('is-open');
        activeMenu = menu;
        activeInput = input || null;
        positionMenu(menu, input);
        if (activeItems.length) highlightActive(menu);

        function itemFromButton(btn) {
            if (!btn) return null;
            const raw = btn.getAttribute('data-payload');
            if (raw) {
                try {
                    return resolveCatalogItem(JSON.parse(decodeURIComponent(raw)));
                } catch (err) { /* fall through */ }
            }
            const fromAttr = resolveCatalogItem({
                item_number: btn.getAttribute('data-item-number') || '',
                name: btn.getAttribute('data-item-name') || '',
                unit: btn.getAttribute('data-item-unit') || '',
            });
            if (fromAttr && (fromAttr.item_number || fromAttr.name)) return fromAttr;
            const idx = Number(btn.getAttribute('data-idx'));
            return resolveCatalogItem(activeItems[idx]);
        }

        function handleMenuAction(e) {
            const actionBtn = e.target.closest('[data-suggest-action]');
            if (actionBtn) {
                e.preventDefault();
                e.stopPropagation();
                const action = actionBtn.getAttribute('data-suggest-action');
                if (action === 'clear') {
                    clearRow(tr, true, options);
                    return;
                }
                if (action === 'replace') {
                    const nameInput = tr.querySelector('input[name="item_name"]');
                    if (nameInput) {
                        nameInput.select();
                        nameInput.focus();
                        openSuggestFor(nameInput, tr, options);
                    }
                    return;
                }
            }
            const btn = e.target.closest('.catalog-suggest-item');
            if (!btn) return;
            e.preventDefault();
            e.stopPropagation();
            applyItem(tr, itemFromButton(btn), options);
        }

        // mousedown before blur — avoids empty activeItems / wrong pick after focus loss
        menu.onmousedown = (e) => {
            if (e.target.closest('.catalog-suggest-item, [data-suggest-action]')) {
                e.preventDefault();
                handleMenuAction(e);
            }
        };
        menu.onclick = (e) => {
            if (e.target.closest('.catalog-suggest-item, [data-suggest-action]')) {
                e.preventDefault();
            }
        };
    }

    function openSuggestFor(input, tr, options) {
        const wrap = ensureWrapped(input);
        const menu = getMenuForWrap(wrap);
        if (!menu || !tr) return;
        const query = (input.value || '').trim();
        if (activeMenu && activeMenu !== menu) closeSuggest();
        activeMenu = menu;
        activeInput = input;
        if (query.length < 1) {
            menu.innerHTML = `
                <div class="catalog-suggest-empty">اكتب للبحث عن صنف من الكتالوج</div>
                <div class="catalog-suggest-actions">
                    <button type="button" class="is-clear" data-suggest-action="clear">إلغاء / مسح</button>
                </div>
            `;
            menu.classList.add('is-open');
            activeItems = [];
            activeIndex = -1;
            positionMenu(menu, input);
            menu.onclick = (e) => {
                if (e.target.closest('[data-suggest-action="clear"]')) {
                    e.preventDefault();
                    clearRow(tr, input.name === 'item_name', options);
                }
            };
            menu.onmousedown = (e) => {
                if (e.target.closest('[data-suggest-action="clear"]')) {
                    e.preventDefault();
                    clearRow(tr, input.name === 'item_name', options);
                }
            };
            return;
        }
        renderSuggest(menu, searchCatalog(query, 8), query, tr, options, input);
    }

    function bindRow(tr, options) {
        if (!tr || tr.dataset.catalogBound === '1') return;
        const opts = options || {};
        const num = tr.querySelector('input[name="item_number"]');
        const name = tr.querySelector('input[name="item_name"]');
        [num, name].forEach((input) => {
            if (!input) return;
            ensureWrapped(input);
            input.classList.add('catalog-suggest-input');
            input.addEventListener('input', () => {
                markFilled(tr);
                openSuggestFor(input, tr, opts);
            });
            input.addEventListener('focus', () => openSuggestFor(input, tr, opts));
            input.addEventListener('keydown', (e) => {
                const menu = getMenuForWrap(input.closest('.catalog-suggest-wrap'));
                const open = menu && menu.classList.contains('is-open') && activeItems.length;
                if (e.key === 'ArrowDown' && open) {
                    e.preventDefault();
                    activeIndex = (activeIndex + 1) % activeItems.length;
                    highlightActive(menu);
                } else if (e.key === 'ArrowUp' && open) {
                    e.preventDefault();
                    activeIndex = (activeIndex - 1 + activeItems.length) % activeItems.length;
                    highlightActive(menu);
                } else if (e.key === 'Enter') {
                    // Never submit/close the parent modal from catalog fields
                    e.preventDefault();
                    e.stopPropagation();
                    if (open && activeIndex >= 0 && activeItems[activeIndex]) {
                        applyItem(tr, activeItems[activeIndex], opts);
                        return;
                    }
                    closeSuggest();
                    if (typeof opts.onEnter === 'function') {
                        opts.onEnter(tr, input, e);
                    }
                } else if (e.key === 'Escape') {
                    closeSuggest();
                } else if ((e.key === 'Backspace' || e.key === 'Delete') && e.ctrlKey) {
                    e.preventDefault();
                    clearRow(tr, input.name === 'item_name', opts);
                }
            });
            input.addEventListener('blur', () => {
                setTimeout(() => {
                    const menu = getMenuForWrap(input.closest('.catalog-suggest-wrap'));
                    if (!(menu && (menu.contains(document.activeElement) || menu.matches(':hover')))) {
                        closeSuggest();
                    }
                }, 180);
            });
        });
        tr.querySelectorAll('.catalog-clear-btn').forEach((btn) => {
            if (btn.dataset.bound === '1') return;
            btn.dataset.bound = '1';
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                clearRow(tr, true, opts);
            });
        });
        tr.dataset.catalogBound = '1';
        markFilled(tr);
    }

    function bindTable(root, options) {
        const scope = typeof root === 'string' ? document.querySelector(root) : root;
        if (!scope) return;
        scope.querySelectorAll('tr').forEach((tr) => {
            if (tr.querySelector('input[name="item_name"], input[name="item_number"]')) {
                bindRow(tr, options);
            }
        });
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.catalog-suggest-wrap') && !e.target.closest('.catalog-suggest-menu')) {
            closeSuggest();
        }
    });
    window.addEventListener('resize', () => {
        if (activeMenu && activeInput) positionMenu(activeMenu, activeInput);
    });
    document.addEventListener('scroll', () => {
        if (activeMenu && activeInput) positionMenu(activeMenu, activeInput);
    }, true);

    return {
        setCatalog,
        fieldHtml,
        bindRow,
        bindTable,
        clearRow,
        closeSuggest,
        applyItem,
    };
})();
</script>
