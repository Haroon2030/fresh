# نشر على Dokploy — الموقع: https://fresh.alrsheed.net
# في Dokploy: Compose → Environment:
#   ALLOWED_HOSTS=fresh.alrsheed.net,web
#   CSRF_TRUSTED_ORIGINS=https://fresh.alrsheed.net
#   PUBLIC_BASE_URL=https://fresh.alrsheed.net
#
# واتساب (Evolution API):
#   EVOLUTION_SERVER_URL=http://72.61.107.230:8081
#   EVOLUTION_API_KEY=...
#   EVOLUTION_INSTANCE_NAME=hr
#   EVOLUTION_NOTIFY_ENABLED=True
#   EVOLUTION_VERIFY_SSL=False
# ثم عبّئ حقل واتساب لمستخدمي: المحاسب / مدير العمليات / مدير النظام

services:
  web:
    build: .
    restart: unless-stopped
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-fresh.alrsheed.net,www.fresh.alrsheed.net,web,localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://fresh.alrsheed.net}
      DB_ENGINE: mysql
      MYSQL_HOST: ${MYSQL_HOST:?Set MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      PORT: "8000"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      EVOLUTION_SERVER_URL: ${EVOLUTION_SERVER_URL:-${EVOLUTION_API_URL:-}}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-${EVOLUTION_INSTANCE:-}}
      EVOLUTION_NOTIFY_ENABLED: ${EVOLUTION_NOTIFY_ENABLED:-True}
      EVOLUTION_VERIFY_SSL: ${EVOLUTION_VERIFY_SSL:-False}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://fresh.alrsheed.net}
    ports:
      - "${APP_PORT:-7080}:8000"
