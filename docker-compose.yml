# نشر على Dokploy مع قاعدة MySQL الخارجية (خدمة قاعدة البيانات في Dokploy)
# في Dokploy: Compose → هذا الملف، ثم افتح المنفذ المنشور (افتراضي 8080)

services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_ENGINE: mysql
      MYSQL_HOST: ${MYSQL_HOST:?Set MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      PORT: "8000"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
    ports:
      - "${APP_PORT:-8080}:8000"
